testClass = "Backup"

# Exercise file/block continuations and transaction-byte limits.
[[knobs]]
backup_rangefile_block_size = 4096
restore_dispatch_addtask_size = 2
restore_dispatch_tx_size = 4096
restore_write_tx_size = 4096

[configuration]

[[test]]
testTitle = 'BackupAndRestorePartitioned'
clearAfterTest = false
simBackupAgents = 'BackupToFile'

    [[test.workload]]
    testName = 'Cycle'
    nodeCount = 3000
    transactionsPerSecond = 2500.0
    testDuration = 30.0

    [[test.workload]]
    testName = 'BackupAndRestorePartitionedCorrectness'
    backupAfter = 10.0
    restoreAfter = 60.0
    backupRangesCount = -1
