# range_lock=enabled must turn enforcement on with ENABLE_READ_LOCK_ON_RANGE left false.
[configuration]

[[knobs]]
enable_read_lock_on_range = false
transaction_lock_rejection_retriable = false
krm_get_range_limit = 4
enable_version_vector = false
enable_version_vector_tlog_unicast = false
enable_version_vector_reply_recovery = false

[[test]]
testTitle = 'RangeLockingConfigTrigger'
useDB = true

    [[test.workload]]
    testName = 'ChangeConfig'
    configMode = 'range_lock=enabled'
    minDelayBeforeChange = 1.0
    maxDelayBeforeChange = 3.0

[[test]]
testTitle = 'RangeLockingConfig'
useDB = true

    [[test.workload]]
    testName = 'RangeLocking'
