[configuration]
config = 'single commit_proxies=1 grv_proxies=2'
singleRegion = true
datacenters = 1
machineCount = 12
statelessProcessClassesPerDC = 3
buggify = false
faultInjection = false

[[knobs]]
enable_native_cdc = true
native_cdc_tag_count = 2
native_cdc_tag_balancing_enabled = true
native_cdc_tag_sample_interval = 0.5
native_cdc_tag_sample_timeout = 5.0
native_cdc_tag_sample_max_age = 30.0
# A disabled live-retag gate must hold even when a move would improve producer balance.
native_cdc_tag_move_cooldown = 0.0
native_cdc_tag_min_relative_improvement = 0.1
native_cdc_tag_min_bytes_per_second_improvement = 100
# Keep producer measurement deterministic within this focused test window.
storage_metrics_average_interval = 1.0
storage_metrics_average_interval_per_kseconds = 1000.0
bytes_written_units_per_sample = 1

[[test]]
testTitle = 'NativeCdcInitialPlacement'
useDB = true
runFailureWorkloads = false
waitForQuiescenceEnd = false
connectionFailuresDisableDuration = 1000000
timeout = 300

    [[test.workload]]
    testName = 'NativeCdcInitialPlacement'
    operationTimeout = 120.0
