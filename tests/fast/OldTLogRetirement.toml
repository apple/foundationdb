[configuration]
config = 'double'
singleRegion = true
datacenters = 1
machineCount = 16
processesPerMachine = 1
coordinators = 1
desiredTLogCount = 4
commitProxyCount = 2
grvProxyCount = 2
resolverCount = 1
statelessProcessClassesPerDC = 4
disableTss = true
buggify = false
faultInjection = false

[[test]]
testTitle = 'OldTLogRetirement'
runFailureWorkloads = false
connectionFailuresDisableDuration = 1000000
timeout = 300

    [[test.workload]]
    testName = 'Cycle'
    nodeCount = 1000
    transactionsPerSecond = 100.0
    testDuration = 60.0

    [[test.workload]]
    testName = 'OldTLogRetirement'
    operationTimeout = 120.0
