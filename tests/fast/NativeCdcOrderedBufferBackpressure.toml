[configuration]
config = 'single logs=1 commit_proxies=1 grv_proxies=2'
singleRegion = true
datacenters = 1
machineCount = 12
statelessProcessClassesPerDC = 3
buggify = false
faultInjection = false

[[knobs]]
enable_native_cdc = true
native_cdc_tag_count = 8
native_cdc_tag_balancing_enabled = false
cdc_proxy_buffer_bytes = 1024
maximum_peek_bytes = 512
cdc_proxy_consume_poll_timeout = 600.0
cdc_proxy_pop_scan_interval = 600.0

[[test]]
testTitle = 'NativeCdcOrderedBufferBackpressure'
useDB = true
runFailureWorkloads = false
runConsistencyCheck = false
waitForQuiescenceEnd = false
connectionFailuresDisableDuration = 1000000
timeout = 240

    [[test.workload]]
    testName = 'NativeCdcOrdered'
    testOwnerReplacement = false
    testBufferBackpressure = true
    operationTimeout = 60.0
