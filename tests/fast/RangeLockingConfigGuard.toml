# `configure range_lock=disabled` is refused while a lock is held. While range locking is off, taking a
# lock fails with range_lock_disabled and the rest of the transaction is not committed.
[configuration]

[[knobs]]
enable_read_lock_on_range = false
enable_version_vector = false
enable_version_vector_tlog_unicast = false
enable_version_vector_reply_recovery = false

[[test]]
testTitle = 'RangeLockingConfigGuard'
useDB = true

    [[test.workload]]
    testName = 'RangeLockConfigGuard'
