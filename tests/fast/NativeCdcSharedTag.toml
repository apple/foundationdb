[configuration]
config = 'single commit_proxies=1 grv_proxies=2'
singleRegion = true
# Two proxies distinguish the persisted tag owner from the proxy receiving registration.
datacenters = 1
machineCount = 12
statelessProcessClassesPerDC = 3
buggify = false
faultInjection = false

[[knobs]]
enable_native_cdc = true
native_cdc_tag_count = 1

[[test]]
testTitle = 'NativeCdcSharedTag'
useDB = true
waitForQuiescenceEnd = false
connectionFailuresDisableDuration = 1000000

    [[test.workload]]
    testName = 'NativeCdcEndToEnd'
    initialStreamCount = 3
    minStreamCount = 2
    maxStreamCount = 3
    keyCount = 6
    writesPerRound = 3
    rounds = 6
    testTagOwnership = true
    drainProbability = 1.0
    delayBetweenRounds = 0.1
    operationTimeout = 120.0
