[configuration]
storageEngineExcludeTypes = [4, 5]
buggify = false
faultInjection = false

[[knobs]]
enable_read_lock_on_range = true
transaction_lock_rejection_retriable = false
enable_version_vector = true
enable_version_vector_tlog_unicast = true
enable_version_vector_reply_recovery = true
proxy_use_resolver_private_mutations = true

[[test]]
testTitle = 'RangeLockVersionVectorRestart'
runSetup = false
runConsistencyCheck = false
waitForQuiescenceBegin = false
waitForQuiescenceEnd = false
connectionFailuresDisableDuration = 1000000

    [[test.workload]]
    testName = 'RangeLockRecovery'
    phase = 'verify'
