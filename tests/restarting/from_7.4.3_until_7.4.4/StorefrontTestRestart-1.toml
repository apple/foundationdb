[configuration]
# Use engines available in both releases, including builds without RocksDB.
storageEngineExcludeTypes = [3, 4, 5]
tenantModes = ['disabled']
encryptModes=['disabled']

[[test]]
testTitle="StorefrontTest"
clearAfterTest=false

    [[test.workload]]
    testName="Storefront"
    actorsPerClient=10
    transactionsPerSecond=200
    itemCount=10000
    maxOrderSize=4

    [[test.workload]]
    testName="SaveAndKill"
    restartInfoLocation="simfdb/restartInfo.ini"
    testDuration=10.0
