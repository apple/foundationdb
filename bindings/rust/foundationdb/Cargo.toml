[package]
name = "foundationdb"
version = "0.11.0"
authors = [
    "Benjamin Fry <benjaminfry@me.com>",
    "Vincent Rouillé <vincent@clikengo.com>",
    "Pierre Zemb <contact@pierrezemb.fr>"
]
edition = "2024"
rust-version = "1.85.1"

description = """
High level client bindings for FoundationDB.
"""

documentation = "https://docs.rs/foundationdb"
repository = "https://github.com/foundationdb-rs/foundationdb-rs"
license = "MIT/Apache-2.0"

readme = "README.md"
keywords = ["foundationdb", "kv"]
categories = ["database"]

[package.metadata.docs.rs]
features = ["embedded-fdb-include", "fdb-7_4", "uuid", "recipes"]

[badges]
codecov = { repository = "foundationdb-rs/foundationdb-rs", branch = "main", service = "github" }

[features]
default = ["uuid", "recipes"]
uuid = ["dep:uuid", "foundationdb-tuple/uuid"]
num-bigint = ["dep:num-bigint", "foundationdb-tuple/num-bigint"]
# Use the locally embedded foundationdb fdb_c.h and fdb.options files
embedded-fdb-include = [
    "foundationdb-sys/embedded-fdb-include",
    "foundationdb-gen/embedded-fdb-include",
]
fdb-5_1 = ["foundationdb-sys/fdb-5_1", "foundationdb-gen/fdb-5_1"]
fdb-5_2 = ["foundationdb-sys/fdb-5_2", "foundationdb-gen/fdb-5_2"]
fdb-6_0 = ["foundationdb-sys/fdb-6_0", "foundationdb-gen/fdb-6_0"]
fdb-6_1 = ["foundationdb-sys/fdb-6_1", "foundationdb-gen/fdb-6_1"]
fdb-6_2 = ["foundationdb-sys/fdb-6_2", "foundationdb-gen/fdb-6_2"]
fdb-6_3 = ["foundationdb-sys/fdb-6_3", "foundationdb-gen/fdb-6_3"]
fdb-7_0 = ["foundationdb-sys/fdb-7_0", "foundationdb-gen/fdb-7_0"]
fdb-7_1 = ["foundationdb-sys/fdb-7_1", "foundationdb-gen/fdb-7_1"]
fdb-7_3 = ["foundationdb-sys/fdb-7_3", "foundationdb-gen/fdb-7_3"]
fdb-7_4 = ["foundationdb-sys/fdb-7_4", "foundationdb-gen/fdb-7_4"]
recipes = ["recipes-leader-election", "recipes-ranked-register"]
recipes-leader-election = ["recipes-ranked-register"]
recipes-ranked-register = []
trace = ["tracing"]

[build-dependencies]
foundationdb-gen = { version = "0.11.0", path = "../foundationdb-gen", default-features = false }

[dependencies]
foundationdb-sys = { version = "0.11.0", path = "../foundationdb-sys", default-features = false }
foundationdb-macros = { version = "0.4.0", path = "../foundationdb-macros" }
foundationdb-tuple = { version = "0.11.0", path = "../foundationdb-tuple" }
futures = "0.3.32"
libc = "0.2"
rand = { version = "0.10.1", features = ["default"] }
static_assertions = "1.1.0"
uuid = { version = "1.23.3", optional = true }
num-bigint = { version = "0.5.1", optional = true }
async-trait = "0.1.89"
async-recursion = "1.1.1"
tracing = { version = "0.1.44", optional = true }

[dev-dependencies]
byteorder = "1.5.0"
lazy_static = "1.5.0"
tokio = { version = "1.52.3", features = ["full"] }
sha2 = "0.11.0"
data-encoding = "2.11.0"
bytesize = "2.4"
uuid = { version = "1.23.3", features = ["v4"] }
futures-util = "0.3.32"
tracing-subscriber = "0.3.23"
