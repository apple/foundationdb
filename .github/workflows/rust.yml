name: Rust bindings

on:
  pull_request:
    branches:
      - main
      - release-*
    paths:
      - bindings/rust/**
      - bindings/c/**
      - bindings/bindingtester/**
      - contrib/local_cluster/binding_test.py
      - cmake/AddFdbTest.cmake
      - cmake/FDBComponents.cmake
      - fdbclient/vexillographer/**
      - flow/ApiVersions.cmake
      - .github/workflows/rust.yml
  push:
    branches:
      - main
      - release-*
    paths:
      - bindings/rust/**
      - bindings/c/**
      - bindings/bindingtester/**
      - contrib/local_cluster/binding_test.py
      - cmake/AddFdbTest.cmake
      - cmake/FDBComponents.cmake
      - fdbclient/vexillographer/**
      - flow/ApiVersions.cmake
      - .github/workflows/rust.yml
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: bindings/rust

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check and unit tests (${{ matrix.toolchain }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.85.1", stable]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install Rust and libclang
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          sudo apt-get update
          sudo apt-get install --yes libclang-dev

      - name: Generate current C headers and options
        run: cmake -DOUTPUT_DIR="$RUNNER_TEMP/rust-fdb-include" -P tests/current_headers.cmake

      - name: Check current headers and options
        env:
          FDB_INCLUDE_DIR: ${{ runner.temp }}/rust-fdb-include
        run: |
          cargo check --locked -p foundationdb --lib --features fdb-7_4

      - name: Check client targets against current headers
        # API version features are mutually exclusive; do not use --all-features.
        env:
          FDB_INCLUDE_DIR: ${{ runner.temp }}/rust-fdb-include
        run: >-
          cargo check --locked --workspace --exclude foundationdb-simulation --all-targets
          --features foundationdb/fdb-7_4,foundationdb/num-bigint,foundationdb/trace,foundationdb-gen/fdb-7_4

      - name: Check simulator C ABI and examples
        env:
          FDB_INCLUDE_DIR: ${{ runner.temp }}/rust-fdb-include
        run: >-
          cargo check --locked --package foundationdb-simulation --all-targets
          --features fdb-7_4

      - name: Check supported historical APIs
        # Some examples require newer APIs; historical compatibility covers the library.
        run: |
          for version in 6_1 6_2 6_3 7_0 7_1 7_3 7_4; do
            cargo check --locked -p foundationdb --lib --no-default-features \
              --features "embedded-fdb-include,fdb-${version},uuid"
          done

      - name: Test tuple encoding and macros
        # These tests do not require libfdb_c or a running FoundationDB cluster.
        run: |
          cargo test --locked -p foundationdb-tuple --all-features
          cargo test --locked -p foundationdb-macros

  format:
    name: Rustfmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUSTUP_TOOLCHAIN: "1.85.1"
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install Rustfmt
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check
